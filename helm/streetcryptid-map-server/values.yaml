# Default values for streetcryptid-map-server.
#
# NOTE: There is deliberately no value that can weaken the privacy boundary. The
# z0-10 raw cutoff and fixed-z10 bundle anchor are compiled into the API image.
# values.schema.json rejects any attempt to add a privacy-weakening key.

nameOverride: ""
fullnameOverride: ""

# Single replica by default: the bundle cache is single-writer (PVC) and the
# tiles PVC is ReadWriteOnce. Do not scale up until cross-replica cache
# coordination is proven.
replicaCount: 1

# Recreate so old and new Martin never serve different datasets concurrently and
# ReadWriteOnce volumes stay safe across a data update.
strategy:
  type: Recreate

image:
  # The custom Go API image built from this repository's Dockerfile (GHCR).
  repository: ghcr.io/unrealjune/streetcryptid-map-server
  tag: ""          # defaults to .Chart.AppVersion
  digest: ""       # if set, pinned by digest and overrides tag
  pullPolicy: IfNotPresent

martin:
  # Upstream Martin, pinned. No Service/Ingress is ever created for it.
  image:
    repository: ghcr.io/maplibre/martin
    tag: "v0.17.0"
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

# --- API container ----------------------------------------------------------
api:
  port: 8080
  # Operational runtime configuration only (no privacy constants).
  bundleWorkers: 16
  bundleMaxBuilds: 1          # bounded whole-bundle memory, independent of workers
  bundleRequestTimeout: 60s
  bundleMaxBytes: 67108864     # 64 MiB decompressed cap
  httpReadTimeout: 15s
  httpWriteTimeout: 90s
  httpIdleTimeout: 60s
  rateLimitPerSec: 20
  rateLimitBurst: 120
  cache:
    # Persistent, checksummed SCB1 stages and complete SCB2 representations.
    dir: /cache
    maxBytes: 4294967296        # 4 GiB payload budget
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi

# --- Tile data: bootstrap + updater -----------------------------------------
tiles:
  dataDir: /data
  # HTTPS URL of the signed manifest.json (manifest.sig is fetched alongside).
  manifestURL: ""
  # Ed25519 verification public key (hex or raw). Mounted via a ConfigMap.
  # REQUIRED whenever autoUpdate is enabled or the volume must bootstrap.
  publicKey: ""
  retainReleases: 2
  # Optional bearer credentials for a private artifact host. Provided ONLY via an
  # existing Secret; never inline in Helm values.
  authSecret:
    name: ""
    key: token
  autoUpdate:
    enabled: true
    interval: 6h
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
  bootstrap:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi

  # --- In-cluster planet bake (option C) ------------------------------------
  # Produces planet.pmtiles ON the cluster instead of downloading it, then
  # `tiles import` installs it as the active release. HEAVILY THROTTLED so it
  # cannot starve the rest of the homelab. Disabled by default; when enabled,
  # keep autoUpdate off (the bake is the update mechanism) and DO NOT set a
  # manifestURL/publicKey — locally baked releases are unsigned and trusted.
  #
  # A planet bake wants ~64 GB RAM, ~500 GB scratch, ~a day. Pin the serving
  # Deployment to the SAME node (top-level nodeSelector) so it can share the
  # ReadWriteOnce tile volume with the bake pod.
  bake:
    enabled: false
    # onthegomap/planetiler, pinned. Runs as the bake init container.
    image:
      repository: ghcr.io/onthegomap/planetiler
      tag: "0.9.0"
      pullPolicy: IfNotPresent
    # Planetiler --area (planet, or a region extract name / .osm.pbf URL).
    area: planet
    minZoom: 0
    maxZoom: 14
    # Restrict baked name:<lang> label variants. OpenMapTiles otherwise emits
    # ~40 languages per label feature, bloating tiles and bundles. "en" keeps
    # name:en; the base name (local), name:latin, name:nonlatin, and name_int
    # are always emitted regardless. Set "default" to restore the full OMT set,
    # or "" to omit the flag (Planetiler default = full set).
    languages: "en"
    # Suspended CronJob by default: trigger on demand with
    #   kubectl create job planet-bake-now --from=cronjob/<release>-bake
    # or set suspend=false to run on the schedule.
    suspend: true
    schedule: "0 3 * * 0"   # weekly, Sunday 03:00 (only runs if suspend=false)
    # Pin to a node that actually has the RAM + disk. delphinium: 12CPU/64GB/2.2TB.
    nodeName: delphinium
    # --- throttles (so the bake does not explode the cluster) ---
    threads: 6                       # Planetiler worker threads (<= cpu limit)
    xmx: "28g"                       # JVM heap; stays well under the memory limit
    downloadMaxBandwidth: "50mb/s"   # cap the ~80 GB OSM source download
    # Low-memory profile: spill the nodemap to the scratch SSD instead of RAM.
    lowMemory: true
    extraArgs: []
    # Yield to real workloads; set to an existing low PriorityClass name.
    priorityClassName: ""
    resources:
      requests:
        cpu: "2"
        memory: 8Gi
      limits:
        cpu: "6"
        memory: 48Gi
    # Dedicated scratch volume for OSM source + temp + nodemap. Single-replica
    # (longhorn-local) so a huge transient volume is not replicated 2-3x.
    scratch:
      size: 700Gi
      storageClass: longhorn-local
    # Resources for the small `tiles import` step that installs the result.
    importResources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

# --- Storage ----------------------------------------------------------------
persistence:
  tiles:
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    storageClass: ""
    # Sized for at least two full releases plus one resumable staging file.
    size: 250Gi
  cache:
    # Single-writer PVC survives pod replacement; allow space for metadata,
    # filesystem allocation, and one bounded atomic temporary representation.
    existingClaim: ""
    size: 6Gi
    storageClass: ""

# --- Service ----------------------------------------------------------------
service:
  # Only API port 8080 is ever exposed. Martin 3000 is never in a Service.
  type: ClusterIP
  port: 8080
  annotations: {}
  # For clusters without an Ingress controller:
  loadBalancerIP: ""

# --- Ingress ----------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: martin.junephilip.com
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""

# --- NetworkPolicy ----------------------------------------------------------
networkPolicy:
  enabled: true
  # Namespaces allowed to scrape /metrics.
  monitoringNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring
  # Extra ingress rules if a specific ingress-controller namespace must reach 8080.
  ingressNamespaceSelector: {}

# --- PodDisruptionBudget ----------------------------------------------------
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# --- ServiceMonitor (Prometheus Operator) -----------------------------------
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# --- Pod security -----------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

# Image used by the `helm test` connection pod.
tests:
  image:
    repository: curlimages/curl
    tag: "8.11.1"
