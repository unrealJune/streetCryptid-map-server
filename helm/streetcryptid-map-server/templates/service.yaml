apiVersion: v1
kind: Service
metadata:
  name: {{ include "scms.fullname" . }}
  labels:
    {{- include "scms.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  selector:
    {{- include "scms.selectorLabels" . | nindent 4 }}
  ports:
    # Only the API port is ever exposed. Martin's port 3000 is intentionally
    # absent: it is reachable only over pod localhost.
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
