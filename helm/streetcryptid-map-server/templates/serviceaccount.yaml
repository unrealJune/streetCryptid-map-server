{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "scms.serviceAccountName" . }}
  labels:
    {{- include "scms.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Only the updater needs the token; it is mounted so the in-cluster REST client
# can patch this one Deployment. RBAC (role.yaml) scopes it to exactly that.
automountServiceAccountToken: true
{{- end }}
