apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scms.fullname" . }}
  labels:
    {{- include "scms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "scms.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scms.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when operational config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "scms.serviceAccountName" . }}
      # The updater patches this Deployment; other containers need no API access,
      # but a single pod SA is used and RBAC is scoped to exactly this Deployment.
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # --- Bootstrap init container ---------------------------------------
      # Activates a valid (or pending) verified release before Martin starts.
      initContainers:
        - name: tiles-bootstrap
          image: {{ include "scms.apiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["tiles", "bootstrap"]
          env:
            {{- include "scms.tilesEnv" . | nindent 12 }}
          volumeMounts:
            - name: tiles
              mountPath: {{ .Values.tiles.dataDir }}
            {{- if .Values.tiles.publicKey }}
            - name: manifest-key
              mountPath: /config
              readOnly: true
            {{- end }}
            {{- if .Values.tiles.authSecret.name }}
            - name: artifact-token
              mountPath: /secrets
              readOnly: true
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.tiles.bootstrap.resources | nindent 12 }}

      containers:
        # --- map-api ---------------------------------------------------------
        - name: map-api
          image: {{ include "scms.apiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":{{ .Values.api.port }}"
            - name: MARTIN_URL
              value: {{ include "scms.martinURL" . | quote }}
            - name: MARTIN_CATALOG_URL
              value: "http://127.0.0.1:{{ .Values.martin.port }}/catalog"
            - name: TILE_DATA_DIR
              value: {{ .Values.tiles.dataDir | quote }}
            - name: BUNDLE_CACHE_DIR
              value: {{ .Values.api.cache.dir | quote }}
            - name: BUNDLE_CACHE_MAX_BYTES
              value: {{ .Values.api.cache.maxBytes | int64 | quote }}
            - name: BUNDLE_WORKERS
              value: {{ .Values.api.bundleWorkers | quote }}
            - name: BUNDLE_MAX_BUILDS
              value: {{ .Values.api.bundleMaxBuilds | quote }}
            - name: BUNDLE_REQUEST_TIMEOUT
              value: {{ .Values.api.bundleRequestTimeout | quote }}
            - name: BUNDLE_MAX_BYTES
              value: {{ .Values.api.bundleMaxBytes | int64 | quote }}
            - name: HTTP_READ_TIMEOUT
              value: {{ .Values.api.httpReadTimeout | quote }}
            - name: HTTP_WRITE_TIMEOUT
              value: {{ .Values.api.httpWriteTimeout | quote }}
            - name: HTTP_IDLE_TIMEOUT
              value: {{ .Values.api.httpIdleTimeout | quote }}
            - name: RATE_LIMIT_PER_SEC
              value: {{ .Values.api.rateLimitPerSec | quote }}
            - name: RATE_LIMIT_BURST
              value: {{ .Values.api.rateLimitBurst | quote }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tiles
              mountPath: {{ .Values.tiles.dataDir }}
              readOnly: true
            - name: cache
              mountPath: {{ .Values.api.cache.dir }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}

        # --- martin (private localhost sidecar) ------------------------------
        - name: martin
          image: "{{ .Values.martin.image.repository }}:{{ .Values.martin.image.tag }}"
          imagePullPolicy: {{ .Values.martin.image.pullPolicy }}
          args:
            - "--listen-addresses"
            - "127.0.0.1:{{ .Values.martin.port }}"
            - "{{ .Values.tiles.dataDir }}/current/planet.pmtiles"
          # No ports are declared: Martin is reached only over pod localhost and
          # must never be exposed by a Service, Ingress, hostPort or LoadBalancer.
          #
          # Martin has NO kubelet probes on purpose. It binds 127.0.0.1:3000 only,
          # but kubelet runs httpGet/tcp probes from the node's network namespace,
          # so it can never reach a pod-loopback-only listener: `host: 127.0.0.1`
          # dials the node's own loopback (503/refused) and omitting host dials
          # podIP:3000 (nothing bound there). Either way the liveness probe fails
          # and kubelet kills a perfectly healthy Martin every ~90s -> CrashLoop,
          # which drags map-api /readyz (it checks Martin's catalog) down with it.
          # Martin's health is instead gated by map-api's /readyz over pod-local
          # 127.0.0.1 -> that container's readiness is what governs the Service.
          volumeMounts:
            - name: tiles
              mountPath: {{ .Values.tiles.dataDir }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.martin.resources | nindent 12 }}

        {{- if .Values.tiles.autoUpdate.enabled }}
        # --- tile-updater ----------------------------------------------------
        - name: tile-updater
          image: {{ include "scms.apiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["tiles", "watch"]
          env:
            {{- include "scms.tilesEnv" . | nindent 12 }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DEPLOYMENT_NAME
              value: {{ include "scms.fullname" . | quote }}
          volumeMounts:
            - name: tiles
              mountPath: {{ .Values.tiles.dataDir }}
            {{- if .Values.tiles.publicKey }}
            - name: manifest-key
              mountPath: /config
              readOnly: true
            {{- end }}
            {{- if .Values.tiles.authSecret.name }}
            - name: artifact-token
              mountPath: /secrets
              readOnly: true
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.tiles.autoUpdate.resources | nindent 12 }}
        {{- end }}

      terminationGracePeriodSeconds: 30
      volumes:
        - name: tiles
          persistentVolumeClaim:
            claimName: {{ include "scms.tilesClaimName" . }}
        - name: cache
          {{- if .Values.persistence.cache.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.cache.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "scms.fullname" . }}-cache
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.tiles.publicKey }}
        - name: manifest-key
          configMap:
            name: {{ include "scms.fullname" . }}-manifest-key
        {{- end }}
        {{- if .Values.tiles.authSecret.name }}
        - name: artifact-token
          secret:
            secretName: {{ .Values.tiles.authSecret.name }}
        {{- end }}
