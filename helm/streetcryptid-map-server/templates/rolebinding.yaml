{{- if or .Values.tiles.autoUpdate.enabled .Values.tiles.bake.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "scms.fullname" . }}-updater
  labels:
    {{- include "scms.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "scms.fullname" . }}-updater
subjects:
  - kind: ServiceAccount
    name: {{ include "scms.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
