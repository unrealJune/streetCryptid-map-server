name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: |
          fmtout="$(gofmt -l .)"
          if [ -n "$fmtout" ]; then
            echo "These files are not gofmt-clean:"; echo "$fmtout"; exit 1
          fi
      - name: go test -race
        run: go test -race ./...

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: helm lint
        run: |
          helm lint helm/streetcryptid-map-server \
            --set tiles.manifestURL=https://artifacts.example.com/manifest.json \
            --set tiles.publicKey=0123456789abcdef
      - name: helm template + assert no Martin exposure
        run: |
          helm template rel helm/streetcryptid-map-server \
            --set tiles.manifestURL=https://artifacts.example.com/manifest.json \
            --set tiles.publicKey=0123456789abcdef \
            --set ingress.enabled=true --show-only templates/service.yaml \
            --show-only templates/ingress.yaml > /tmp/svc.yaml
          if grep -E '^\s*(port|number):\s*3000' /tmp/svc.yaml; then
            echo "Martin port 3000 leaked into a Service/Ingress"; exit 1
          fi
          echo "OK: Martin 3000 not exposed"
      - name: reject privacy-weakening value
        run: |
          if helm template rel helm/streetcryptid-map-server \
            --set tiles.manifestURL=https://artifacts.example.com/manifest.json \
            --set tiles.publicKey=0123456789abcdef \
            --set disablePrivacy=true >/dev/null 2>&1; then
            echo "schema accepted disablePrivacy"; exit 1
          fi
          echo "OK: disablePrivacy rejected by schema"

  # The terrain bake against the real public DEM, on one 1-degree cell (Kyoto),
  # then installed with the server's own import so the Go reader proves it can
  # serve what Python wrote. Keeps the year-scale bake from breaking silently.
  terrain-bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: build the bake image
        run: docker build -t terrain-bake terrain
      - name: bake one cell
        run: |
          mkdir -p "$RUNNER_TEMP/bake"
          docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/bake:/work" terrain-bake \
            --output /work/terrain.pmtiles --workdir /work/wd \
            --bbox 135.2,34.8,135.8,35.2 --max-zoom 11 --workers 2
          ls -la "$RUNNER_TEMP/bake"
      - name: import with the server
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          TILE_DATA_DIR="$RUNNER_TEMP/data" go run ./cmd/server tiles import-terrain \
            "$RUNNER_TEMP/bake/terrain.pmtiles" ci-smoke
          test -s "$RUNNER_TEMP/data/terrain/terrain.pmtiles"

  # The planet bake image against a real (small) extract: proves the land cover
  # patch still applies, builds, and puts OSM forest into z6 tiles, which the
  # stock OpenMapTiles profile leaves empty below z7.
  planetiler-bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the bake image
        run: docker build -t planetiler-bake planetiler
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bake/sources
          key: planetiler-sources-luxembourg-v1
      - name: bake Luxembourg to z7
        run: |
          mkdir -p "$RUNNER_TEMP/bake/sources" "$RUNNER_TEMP/bake/tmp"
          docker run --rm --user "$(id -u):$(id -g)" -e JAVA_TOOL_OPTIONS=-Xmx3g \
            -v "$RUNNER_TEMP/bake:/work" planetiler-bake \
            --download --area=luxembourg --maxzoom=7 --languages=en \
            --download-dir=/work/sources --tmpdir=/work/tmp \
            --force --output=/work/out.pmtiles
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OSM land cover below z7, none at z4
        run: |
          pip install --quiet pmtiles mapbox-vector-tile
          python planetiler/check_landcover.py "$RUNNER_TEMP/bake/out.pmtiles" \
            --lat 49.85 --lon 6.0 --class wood
